<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Order Tracker — Real-Time CDC Dashboard</title>
    <meta name="description" content="Real-time order tracking dashboard powered by PostgreSQL CDC and Server-Sent Events">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Real-Time Order Tracker</h1>
            <p>Live CDC pipeline — PostgreSQL WAL → Server-Sent Events</p>
        </header>

        <div id="status-bar" class="status-bar">
            <span id="pulse" class="pulse disconnected"></span>
            <span id="status-text">Connecting to SSE stream...</span>
        </div>



        <div class="stats" id="stats">
            <div class="stat-card"><div class="value" id="stat-total">0</div><div class="label">Total Orders</div></div>
            <div class="stat-card pending"><div class="value" id="stat-pending">0</div><div class="label">Pending</div></div>
            <div class="stat-card shipped"><div class="value" id="stat-shipped">0</div><div class="label">Shipped</div></div>
            <div class="stat-card delivered"><div class="value" id="stat-delivered">0</div><div class="label">Delivered</div></div>
        </div>

        <form class="create-form" onsubmit="event.preventDefault(); createOrder();">
            <h2>Create New Order</h2>
            <div class="form-row">
                <label for="inp-customer" class="sr-only">Customer Name</label>
                <input type="text" id="inp-customer" placeholder="Customer name" maxlength="100" required>
                
                <label for="inp-product" class="sr-only">Product Name</label>
                <input type="text" id="inp-product" placeholder="Product name" maxlength="100" required>
                
                <label for="inp-status" class="sr-only">Status</label>
                <select id="inp-status">
                    <option value="pending">Pending</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                </select>
                <button type="submit" class="btn-create" id="btn-create">+ Create Order</button>
            </div>
        </form>

        <h2 class="section-title">Live Orders</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Status</th>
                        <th>Updated</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-body">
                    <tr id="empty-row"><td colspan="6" class="empty-state">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="event-log">
            <h2>CDC Event Log</h2>
            <div class="log-entries" id="log-entries"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
