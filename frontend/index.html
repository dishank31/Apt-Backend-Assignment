<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Order Tracker — Real-Time CDC Dashboard</title>
    <meta name="description" content="Real-time order tracking dashboard powered by PostgreSQL CDC and Server-Sent Events">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(17, 24, 45, 0.85);
            --bg-glass: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text-primary: #e2e8f0;
            --text-muted: #64748b;
            --accent-blue: #38bdf8;
            --accent-amber: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #a78bfa;
            --radius: 12px;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56,189,248,0.1), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(167,139,250,0.08), transparent);
        }

        .app { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* ── Header ─────────────────────────────── */
        .header { margin-bottom: 2rem; }
        .header h1 {
            font-size: 1.75rem; font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-muted); margin-top: 0.25rem; font-size: 0.9rem; }

        /* ── Connection Status ──────────────────── */
        .status-bar {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.75rem 1.25rem; border-radius: var(--radius);
            background: var(--bg-glass); border: 1px solid var(--border);
            margin-bottom: 1.5rem; font-size: 0.85rem; font-weight: 500;
        }
        .pulse {
            width: 10px; height: 10px; border-radius: 50%;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        .pulse.connected { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .pulse.disconnected { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* ── Stats Bar ──────────────────────────── */
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem; margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-glass); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1rem 1.25rem; text-align: center;
        }
        .stat-card .value { font-size: 1.75rem; font-weight: 700; }
        .stat-card .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }
        .stat-card.pending .value { color: var(--accent-blue); }
        .stat-card.shipped .value { color: var(--accent-amber); }
        .stat-card.delivered .value { color: var(--accent-green); }

        /* ── Create Form ────────────────────────── */
        .create-form {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem;
            margin-bottom: 2rem; backdrop-filter: blur(12px);
        }
        .create-form h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
        .form-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .form-row input, .form-row select {
            flex: 1; min-width: 160px; padding: 0.6rem 1rem;
            background: var(--bg-glass); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text-primary); font-size: 0.85rem;
            font-family: inherit; outline: none; transition: border-color 0.2s;
        }
        .form-row input:focus, .form-row select:focus { border-color: var(--accent-blue); }
        .form-row input::placeholder { color: var(--text-muted); }
        .form-row select option { background: #1e293b; }
        .btn-create {
            padding: 0.6rem 1.5rem; border: none; border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff; font-weight: 600; font-size: 0.85rem; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s; font-family: inherit;
        }
        .btn-create:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(56,189,248,0.3); }
        .btn-create:active { transform: scale(0.97); }

        /* ── Orders Table ───────────────────────── */
        .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
        .table-wrap {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden; backdrop-filter: blur(12px);
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: rgba(255,255,255,0.03); }
        th {
            padding: 0.85rem 1.25rem; text-align: left;
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border);
        }
        td { padding: 0.85rem 1.25rem; font-size: 0.85rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr { transition: background 0.2s; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge {
            display: inline-block; padding: 0.2rem 0.65rem; border-radius: 20px;
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .badge-pending { background: rgba(56,189,248,0.15); color: var(--accent-blue); }
        .badge-shipped { background: rgba(245,158,11,0.15); color: var(--accent-amber); }
        .badge-delivered { background: rgba(16,185,129,0.15); color: var(--accent-green); }

        .actions { display: flex; gap: 0.4rem; }
        .btn-action {
            padding: 0.3rem 0.65rem; border: 1px solid var(--border); border-radius: 6px;
            background: transparent; color: var(--text-muted); font-size: 0.7rem;
            cursor: pointer; transition: all 0.15s; font-family: inherit;
        }
        .btn-action:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
        .btn-action.danger:hover { border-color: var(--accent-red); color: var(--accent-red); }

        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.9rem; }

        /* ── Event Log ──────────────────────────── */
        .event-log {
            margin-top: 2rem; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.25rem; backdrop-filter: blur(12px);
        }
        .event-log h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
        .log-entries {
            max-height: 200px; overflow-y: auto; font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; line-height: 1.8; color: var(--text-muted);
        }
        .log-entries::-webkit-scrollbar { width: 4px; }
        .log-entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .log-entry-insert { color: var(--accent-green); }
        .log-entry-update { color: var(--accent-amber); }
        .log-entry-delete { color: var(--accent-red); }

        /* ── Toast ──────────────────────────────── */
        .toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast {
            padding: 0.75rem 1.25rem; border-radius: 8px; font-size: 0.8rem; font-weight: 500;
            background: var(--bg-card); border: 1px solid var(--border);
            backdrop-filter: blur(16px); box-shadow: var(--shadow);
            animation: toast-in 0.3s ease-out;
        }
        .toast.fade-out { animation: toast-out 0.3s ease-in forwards; }
        @keyframes toast-in { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateX(40px); } }

        /* ── Row animation ──────────────────────── */
        @keyframes row-flash {
            0% { background: rgba(56,189,248,0.15); }
            100% { background: transparent; }
        }
        .row-new { animation: row-flash 1.5s ease-out; }

        /* ── Responsive ─────────────────────────── */
        @media (max-width: 700px) {
            .form-row { flex-direction: column; }
            th:nth-child(5), td:nth-child(5) { display: none; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Real-Time Order Tracker</h1>
            <p>Live CDC pipeline — PostgreSQL WAL → Server-Sent Events</p>
        </header>

        <div id="status-bar" class="status-bar">
            <span id="pulse" class="pulse disconnected"></span>
            <span id="status-text">Connecting to SSE stream...</span>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card"><div class="value" id="stat-total">0</div><div class="label">Total Orders</div></div>
            <div class="stat-card pending"><div class="value" id="stat-pending">0</div><div class="label">Pending</div></div>
            <div class="stat-card shipped"><div class="value" id="stat-shipped">0</div><div class="label">Shipped</div></div>
            <div class="stat-card delivered"><div class="value" id="stat-delivered">0</div><div class="label">Delivered</div></div>
        </div>

        <div class="create-form">
            <h2>Create New Order</h2>
            <div class="form-row">
                <input type="text" id="inp-customer" placeholder="Customer name" maxlength="100">
                <input type="text" id="inp-product" placeholder="Product name" maxlength="100">
                <select id="inp-status">
                    <option value="pending">Pending</option>
                    <option value="shipped">Shipped</option>
                    <option value="delivered">Delivered</option>
                </select>
                <button class="btn-create" id="btn-create" onclick="createOrder()">+ Create Order</button>
            </div>
        </div>

        <h2 class="section-title">Live Orders</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Status</th>
                        <th>Updated</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="orders-body">
                    <tr id="empty-row"><td colspan="6" class="empty-state">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="event-log">
            <h2>CDC Event Log</h2>
            <div class="log-entries" id="log-entries"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // Dynamically resolve API base URL from current hostname so the
        // dashboard works regardless of whether it's opened via localhost,
        // 127.0.0.1, or a remote host. The backend always runs on port 8000.
        const API_HOST = window.location.hostname || 'localhost';
        const API = `http://${API_HOST}:8000/api/v1/orders`;
        const ordersMap = new Map();

        // ──────────────────────────────────────────────────────────
        // requestAnimationFrame Batching System
        //
        // Instead of calling renderTable() on every SSE event (which
        // would cause 100 full DOM rebuilds during a data tsunami),
        // we buffer all incoming changes and flush them in a single
        // requestAnimationFrame callback (~16ms batching window).
        // ──────────────────────────────────────────────────────────

        let pendingChanges = [];
        let rafScheduled = false;

        /**
         * Queue a batch of WAL changes for the next animation frame.
         * Multiple SSE messages arriving within the same frame are
         * coalesced into a single DOM update.
         */
        function enqueueChanges(changes) {
            pendingChanges.push(...changes);
            if (!rafScheduled) {
                rafScheduled = true;
                requestAnimationFrame(flushPendingChanges);
            }
        }

        /**
         * Process ALL queued changes in one shot, then do a single
         * DOM render + a single summary toast.
         */
        function flushPendingChanges() {
            rafScheduled = false;
            if (pendingChanges.length === 0) return;

            // Drain the buffer
            const batch = pendingChanges.splice(0, pendingChanges.length);

            let inserts = 0, updates = 0, deletes = 0;
            const flashIds = [];

            for (const m of batch) {
                if (m.kind === 'delete') {
                    const pk = m.oldkeys?.keyvalues?.[0];
                    if (pk) {
                        ordersMap.delete(Number(pk));
                        deletes++;
                        logEvent('delete', `Order #${pk} deleted`);
                    }
                } else {
                    const obj = {};
                    m.columnnames.forEach((c, i) => obj[c] = m.columnvalues[i]);
                    obj.id = Number(obj.id);
                    const isNew = !ordersMap.has(obj.id);
                    ordersMap.set(obj.id, obj);

                    if (isNew) {
                        inserts++;
                    } else {
                        updates++;
                    }
                    logEvent(m.kind, `Order #${obj.id} — ${obj.customer_name} — ${obj.status}`);
                    flashIds.push(obj.id);
                }
            }

            // Single DOM render for the entire batch
            renderTable();

            // Flash all new/updated rows
            for (const id of flashIds) {
                flashRow(id);
            }

            // Summary toasts instead of per-event toasts
            if (inserts > 0) showToast(`${inserts} new order${inserts > 1 ? 's' : ''} created`, 'insert');
            if (updates > 0) showToast(`${updates} order${updates > 1 ? 's' : ''} updated`, 'update');
            if (deletes > 0) showToast(`${deletes} order${deletes > 1 ? 's' : ''} deleted`, 'delete');
        }


        // ── Toast Notifications ──────────────────
        const MAX_VISIBLE_TOASTS = 5;

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');

            // Limit visible toasts to prevent toast flooding
            while (c.children.length >= MAX_VISIBLE_TOASTS) {
                c.firstChild.remove();
            }

            const t = document.createElement('div');
            t.className = 'toast';
            const colors = { insert: '#10b981', update: '#f59e0b', delete: '#ef4444', info: '#38bdf8' };
            t.style.borderLeftColor = colors[type] || colors.info;
            t.style.borderLeftWidth = '3px';
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => { t.classList.add('fade-out'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        // ── CDC Event Log ────────────────────────
        const MAX_LOG_ENTRIES = 100;

        function logEvent(kind, detail) {
            const el = document.getElementById('log-entries');
            const ts = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = `log-entry-${kind}`;
            line.textContent = `[${ts}] ${kind.toUpperCase()}: ${detail}`;
            el.prepend(line);
            // Trim excess entries to prevent unbounded DOM growth
            while (el.children.length > MAX_LOG_ENTRIES) {
                el.lastChild.remove();
            }
        }

        // ── Stats ────────────────────────────────
        function updateStats() {
            let p = 0, s = 0, d = 0;
            ordersMap.forEach(o => { if (o.status === 'pending') p++; else if (o.status === 'shipped') s++; else d++; });
            document.getElementById('stat-total').textContent = ordersMap.size;
            document.getElementById('stat-pending').textContent = p;
            document.getElementById('stat-shipped').textContent = s;
            document.getElementById('stat-delivered').textContent = d;
        }

        // ── Render Table ─────────────────────────
        // Uses DocumentFragment for a single reflow instead of multiple
        // innerHTML assignments. This is critical for tsunami performance.
        function renderTable() {
            const body = document.getElementById('orders-body');
            if (ordersMap.size === 0) {
                body.innerHTML = '<tr id="empty-row"><td colspan="6" class="empty-state">No orders yet. Create one above!</td></tr>';
                updateStats(); return;
            }

            const sorted = [...ordersMap.values()].sort((a, b) => {
                // Handle both Date strings and raw timestamps
                const da = new Date(a.updated_at);
                const db = new Date(b.updated_at);
                return db - da;
            });

            // Build all HTML in a single string, then assign once
            body.innerHTML = sorted.map(o => `
                <tr id="row-${o.id}">
                    <td><strong>#${o.id}</strong></td>
                    <td>${escHtml(o.customer_name)}</td>
                    <td>${escHtml(o.product_name)}</td>
                    <td><span class="badge badge-${o.status}">${o.status}</span></td>
                    <td style="color:var(--text-muted);font-size:0.8rem">${new Date(o.updated_at).toLocaleString()}</td>
                    <td class="actions">
                        ${o.status === 'pending' ? `<button class="btn-action" onclick="updateStatus(${o.id},'shipped')">Ship</button>` : ''}
                        ${o.status === 'shipped' ? `<button class="btn-action" onclick="updateStatus(${o.id},'delivered')">Deliver</button>` : ''}
                        <button class="btn-action danger" onclick="deleteOrder(${o.id})">Delete</button>
                    </td>
                </tr>`).join('');

            updateStats();
        }

        function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function flashRow(id) {
            const row = document.getElementById(`row-${id}`);
            if (row) { row.classList.remove('row-new'); void row.offsetWidth; row.classList.add('row-new'); }
        }

        // ── API Calls ────────────────────────────
        async function loadOrders() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                ordersMap.clear();
                data.forEach(o => ordersMap.set(o.id, o));
                renderTable();
            } catch (e) { console.error('Failed to load orders', e); }
        }

        async function createOrder() {
            const cn = document.getElementById('inp-customer').value.trim();
            const pn = document.getElementById('inp-product').value.trim();
            const st = document.getElementById('inp-status').value;
            if (!cn || !pn) { showToast('Please fill in all fields', 'info'); return; }
            try {
                const res = await fetch(API, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_name: cn, product_name: pn, status: st })
                });
                if (!res.ok) throw new Error(await res.text());
                document.getElementById('inp-customer').value = '';
                document.getElementById('inp-product').value = '';
                showToast(`Order created for ${cn}`, 'insert');
            } catch (e) { showToast('Failed to create order', 'delete'); }
        }

        async function updateStatus(id, status) {
            try {
                const res = await fetch(`${API}/${id}`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if (!res.ok) throw new Error(await res.text());
            } catch (e) { showToast('Failed to update order', 'delete'); }
        }

        async function deleteOrder(id) {
            try {
                const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(await res.text());
            } catch (e) { showToast('Failed to delete order', 'delete'); }
        }

        // ── SSE Stream ───────────────────────────
        function connectSSE() {
            const es = new EventSource(`${API}/stream`);
            const pulse = document.getElementById('pulse');
            const stxt = document.getElementById('status-text');

            es.onopen = () => {
                pulse.className = 'pulse connected';
                stxt.textContent = 'Connected — listening to PostgreSQL WAL stream';
            };
            es.onerror = () => {
                pulse.className = 'pulse disconnected';
                stxt.textContent = 'Disconnected — reconnecting...';
            };
            es.onmessage = (e) => {
                try {
                    const payload = JSON.parse(e.data);
                    if (!payload.change) return;

                    // Enqueue for batched rendering instead of immediate DOM update
                    enqueueChanges(payload.change);

                } catch (err) { console.error('SSE parse error', err); }
            };
        }

        // ── Init ─────────────────────────────────
        loadOrders();
        connectSSE();
    </script>
</body>
</html>
